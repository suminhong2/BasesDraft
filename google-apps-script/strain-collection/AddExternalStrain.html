<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
  <form id="form" class="grid" onsubmit="submitForm(event)">
    <div>
      <label for="strain_number">Strain number</label>
      <div class="inline">
        <input id="strain_number" name="strain_number" placeholder="CB1370">
        <button type="button" id="lookup" onclick="lookupCgc()">Look up on CGC</button>
      </div>
      <div class="hint" id="lookupStatus"></div>
    </div>
    <div>
      <label for="source">Comes from</label>
      <select id="source" name="source">
        <option>CGC</option>
        <option>NBRP</option>
        <option>Other lab</option>
      </select>
    </div>

    <div class="full panel" id="otherLab" hidden>
      <div class="grid">
        <div>
          <label for="prefix">Name it with a prefix</label>
          <select id="prefix" name="prefix"><option value="">Loading prefixes...</option></select>
          <div class="hint" id="prefixHint"></div>
        </div>
        <div>
          <label for="prefix_number">Number <span class="hint">(change it to follow the lab's own numbering)</span></label>
          <input id="prefix_number" name="prefix_number" type="number" min="1" disabled>
        </div>
        <div class="full">
          <label for="original_name">Name in the lab it came from <span class="hint">(optional, saved in the notes)</span></label>
          <input id="original_name" name="original_name" placeholder="e.g. OH15432">
        </div>
        <div class="full" id="newPrefix" hidden>
          <div class="grid">
            <div>
              <label for="new_prefix">New prefix <span class="hint">(1-5 letters, e.g. your initials)</span></label>
              <input id="new_prefix" placeholder="SH" maxlength="5">
            </div>
            <div>
              <label for="new_owner">Whose prefix is it?</label>
              <input id="new_owner" placeholder="Sumin Hong, or Hobert lab">
            </div>
            <div>
              <label for="new_start">Start numbering at</label>
              <input id="new_start" type="number" min="1" value="1">
            </div>
            <div class="hint" style="align-self:end">e.g. 15903 if that lab's strains already go up to OH15902</div>
            <div class="full inline">
              <button type="button" id="checkPrefix" onclick="addPrefix(false)">Check availability and add</button>
              <button type="button" id="confirmPrefix" onclick="addPrefix(true)" hidden>I'm in that lab, add it anyway</button>
            </div>
            <div class="full hint" id="newPrefixStatus"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="full">
      <label for="geno">Alleles / arrays</label>
      <input id="geno" name="geno" placeholder="unc-3(e151) X">
    </div>
    <div>
      <label for="back">Strain background</label>
      <input id="back" name="back" placeholder="him-5 or pha-1 for example">
    </div>
    <div>
      <label for="author">Generated by</label>
      <input id="author" name="author" placeholder="your name; X lab or CGC / your name" required>
    </div>
    <div class="full">
      <label for="contents">DNA on array</label>
      <textarea id="contents" name="contents" placeholder="myo-2prom::GFP"></textarea>
    </div>
    <div class="full">
      <label for="comments">Notes and generation info</label>
      <textarea id="comments" name="comments" placeholder="CRISPR Mello method with guides X and Y"></textarea>
    </div>
    <div>
      <label for="maintenance">Maintenance info</label>
      <input id="maintenance" name="maintenance" placeholder="Grows at 15C.">
    </div>
    <div>
      <label for="availability">Publicly available?</label>
      <input id="availability" name="availability" placeholder="CGC">
    </div>
    <div class="full">
      <label for="location">Location <span class="hint">(must contain "box" to be requestable)</span></label>
      <input id="location" name="location" placeholder="Only the strain manager should edit this">
    </div>
    <div class="full buttons">
      <button type="button" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" class="primary" id="submit">Submit</button>
    </div>
    <div class="full" id="error"></div>
  </form>

  <script>
    const $ = id => document.getElementById(id);
    let prefixes = [];

    // ----- Prefixes for strains from other labs -----
    function loadPrefixes(selectPrefix) {
      google.script.run
        .withSuccessHandler(list => {
          prefixes = list;
          const sel = $('prefix');
          sel.innerHTML = '';
          sel.add(new Option('No prefix: keep the name I typed', ''));
          list.forEach(p => sel.add(new Option(
            p.prefix + (p.owner ? ' (' + p.owner + ')' : '') + ': next ' + p.prefix + p.nextNumber, p.prefix)));
          sel.add(new Option('+ Create a new prefix...', '__new'));
          sel.value = selectPrefix || '';
          onPrefixChange();
        })
        .withFailureHandler(err => { $('prefixHint').textContent = 'Could not load prefixes: ' + (err.message || err); })
        .listStrainPrefixes();
    }

    function onPrefixChange() {
      const value = $('prefix').value;
      const name = $('strain_number');
      $('newPrefix').hidden = value !== '__new';
      const p = prefixes.find(x => x.prefix === value);
      const num = $('prefix_number');
      if (p) {
        num.disabled = false;
        num.value = p.nextNumber;
        num.dataset.suggested = p.nextNumber;
        name.value = p.prefix + p.nextNumber;
        name.readOnly = true;
        $('prefixHint').textContent = (p.last ? 'Last used: ' + p.last + '. ' : 'First strain with this prefix. ') +
          'The suggested number is confirmed when you submit.';
      } else {
        num.disabled = true;
        num.value = '';
        if (name.readOnly) name.value = '';
        name.readOnly = false;
        $('prefixHint').textContent = value === '__new' ? 'Fill in the new prefix below.' : '';
      }
    }

    function addPrefix(confirmAnyway) {
      const status = $('newPrefixStatus');
      $('checkPrefix').disabled = true;
      $('confirmPrefix').hidden = true;
      status.textContent = 'Checking the prefix list, the Strains sheet and the CGC lab codes...';
      google.script.run
        .withSuccessHandler(res => {
          $('checkPrefix').disabled = false;
          status.textContent = res.ok ? res.prefix + ' is free and has been added. First name: ' + res.next : res.message;
          if (res.cgc) $('confirmPrefix').hidden = false;
          if (res.ok) loadPrefixes(res.prefix);
        })
        .withFailureHandler(err => { $('checkPrefix').disabled = false; status.textContent = err.message || err; })
        .registerStrainPrefix($('new_prefix').value, $('new_owner').value, confirmAnyway, $('new_start').value);
    }

    function onSourceChange() {
      const other = $('source').value === 'Other lab';
      $('otherLab').hidden = !other;
      $('lookup').hidden = other;
      if (!other) { $('prefix').value = ''; onPrefixChange(); }
      else if (!prefixes.length) loadPrefixes();
    }
    $('source').addEventListener('change', onSourceChange);
    $('prefix').addEventListener('change', onPrefixChange);
    $('prefix_number').addEventListener('input', () => {
      $('strain_number').value = $('prefix').value + $('prefix_number').value;
    });

    // ----- CGC lookup -----
    // Fills the form from the CGC strain page. Only overwrites fields the CGC knows about.
    function lookupCgc() {
      const name = $('strain_number').value.trim();
      const status = $('lookupStatus');
      const btn = $('lookup');
      if (!name) { status.textContent = 'Type a strain number first.'; return; }
      btn.disabled = true;
      status.textContent = 'Searching the CGC...';
      google.script.run
        .withSuccessHandler(strain => {
          btn.disabled = false;
          if (!strain) {
            status.textContent = name + ' was not found on the CGC. If it comes from another lab, choose "Other lab".';
            return;
          }
          $('strain_number').value = strain.name;
          $('source').value = 'CGC';
          onSourceChange();
          $('geno').value = strain.genotype;
          $('comments').value = strain.description +
            (strain.mutagen ? ' Mutagen: ' + strain.mutagen + '.' : '') + ' ' + strain.url;
          $('author').value = strain.madeBy + (strain.lab ? '; ' + strain.lab + ' lab' : '') + ' / CGC';
          $('availability').value = 'CGC';
          status.textContent = 'Filled in from the CGC. Add background and location, then submit.';
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          status.textContent = 'Lookup failed: ' + (err.message || err);
        })
        .lookupCgcStrain(name);
    }

    // ----- Submit -----
    function submitForm(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData($('form')).entries());
      if (data.prefix === '__new') { $('error').textContent = 'Add the new prefix first, or pick one from the list.'; return; }
      if (!data.prefix && !$('strain_number').value.trim()) { $('error').textContent = 'Type a strain number.'; return; }
      data.strain_number = $('strain_number').value.trim();
      if (data.prefix) {
        data.strain_number = '';   // worked out on save
        // Only send a number the person typed; the suggested one is recalculated on save
        if (String(data.prefix_number) === $('prefix_number').dataset.suggested) data.prefix_number = '';
      }
      const btn = $('submit');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      $('error').textContent = '';
      google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = 'Submit';
          $('error').textContent = err.message || err;
        })
        .writeNewStrain(data);
    }
  </script>
</body>
</html>
