<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
  <form id="form" class="grid" onsubmit="submitForm(event)">
    <div>
      <label for="strain_preview">New strain number</label>
      <input id="strain_preview" readonly>
    </div>
    <div>
      <label for="quantity">Number of strains to create at once</label>
      <input id="quantity" name="quantity" type="number" min="1" max="100" value="1" required>
    </div>
    <div class="full">
      <label for="types">Choose a strain type</label>
      <select id="types" name="types"></select>
      <div class="hint" id="preview"></div>
    </div>
    <div class="full">
      <label for="geno">Alleles / arrays <span class="hint">(the new allele name is added in front automatically)</span></label>
      <input id="geno" name="geno" placeholder="unc-3(e151) X">
    </div>
    <div>
      <label for="back">Strain background</label>
      <input id="back" name="back" placeholder="him-5 or pha-1 for example">
    </div>
    <div>
      <label for="author">Generated by</label>
      <input id="author" name="author" placeholder="your name; X lab or CGC / your name" required>
    </div>
    <div class="full">
      <label for="contents">DNA on array</label>
      <textarea id="contents" name="contents" placeholder="myo-2prom::GFP"></textarea>
    </div>
    <div class="full">
      <label for="comments">Notes and generation info</label>
      <textarea id="comments" name="comments" placeholder="CRISPR Mello method with guides X and Y"></textarea>
    </div>
    <div>
      <label for="maintenance">Maintenance info</label>
      <input id="maintenance" name="maintenance" placeholder="Grows at 15C.">
    </div>
    <div>
      <label for="availability">Publicly available?</label>
      <input id="availability" name="availability" placeholder="CGC">
    </div>
    <div class="full">
      <label for="location">Location <span class="hint">(must contain "box" to be requestable)</span></label>
      <input id="location" name="location" placeholder="Only the strain manager should edit this">
    </div>
    <div class="full buttons">
      <button type="button" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" class="primary" id="submit">Submit</button>
    </div>
    <div class="full" id="error"></div>
  </form>

  <script>
    // [lab code, allele code, next strain number, [[names], [abbrevs], [next numbers]]]
    const info = <?!= types ?>;
    const labCode = info[0], alleleCode = info[1], nextStrain = Number(info[2]);
    const names = info[3][0], abbrevs = info[3][1], nextNums = info[3][2];

    const select = document.getElementById('types');
    select.add(new Option('I only need the new strain number', '0'));
    names.forEach((name, i) => {
      if (name !== '') select.add(new Option(name + ' - ' + alleleCode + abbrevs[i] + nextNums[i], String(i + 1)));
    });

    function updatePreview() {
      const type = Number(select.value);
      const qty = Math.max(1, Number(document.getElementById('quantity').value) || 1);
      document.getElementById('strain_preview').value =
        labCode + nextStrain + (qty > 1 ? ' to ' + labCode + (nextStrain + qty - 1) : '');
      let text = 'Numbers are confirmed when you submit, in case someone else adds a strain first.';
      if (type > 0) {
        const start = Number(nextNums[type - 1]);
        const prefix = alleleCode + abbrevs[type - 1];
        text = 'New name: ' + prefix + start + (qty > 1 ? ' to ' + prefix + (start + qty - 1) : '') +
               ', added in front of Alleles / arrays. ' + text;
      }
      document.getElementById('preview').textContent = text;
    }
    select.addEventListener('change', updatePreview);
    document.getElementById('quantity').addEventListener('input', updatePreview);
    updatePreview();

    function submitForm(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(document.getElementById('form')).entries());
      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      document.getElementById('error').textContent = '';
      google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = 'Submit';
          document.getElementById('error').textContent = err.message || err;
        })
        .dealWithNewStrain(data);
    }
  </script>
</body>
</html>
