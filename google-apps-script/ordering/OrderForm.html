<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
  <form id="form" class="grid" onsubmit="submitForm(event)">
    <div class="full">
      <label for="type">What kind of order?</label>
      <select id="type" name="type">
        <option>Strain</option>
        <option disabled>Plasmid (coming soon)</option>
        <option disabled>Oligo (coming soon)</option>
        <option>Supplies / other</option>
      </select>
    </div>

    <!-- Strain: checked against the strain collection and the CGC -->
    <div class="full panel" id="strainPanel">
      <div class="grid">
        <div>
          <label for="strain">Strain</label>
          <div class="inline">
            <input id="strain" name="strain" placeholder="CB1370">
            <button type="button" id="check" onclick="checkStrain()">Check</button>
          </div>
        </div>
        <div>
          <label for="source">Order from</label>
          <select id="source" name="source">
            <option>CGC</option>
            <option>NBRP</option>
            <option>Other lab</option>
          </select>
        </div>
        <div class="full">
          <label for="geno">Alleles / arrays</label>
          <input id="geno" name="geno" placeholder="Filled in by Check">
        </div>
        <div class="full hint" id="strainStatus">Press Check to see if it's already in our collection and on the CGC.</div>
      </div>
    </div>

    <!-- Supplies and anything else -->
    <div class="full panel" id="suppliesPanel" hidden>
      <div class="grid">
        <div class="full">
          <label for="item">What do you need?</label>
          <input id="item" name="item" placeholder="Agar, 1 kg">
        </div>
        <div>
          <label for="vendor">Vendor</label>
          <input id="vendor" name="vendor" list="vendors" placeholder="Sigma, Fisher, IDT...">
          <datalist id="vendors"></datalist>
        </div>
        <div>
          <label for="catalog">Catalog #</label>
          <input id="catalog" name="catalog" placeholder="A1296">
        </div>
        <div class="full">
          <label for="link">Link to the product <span class="hint">(optional)</span></label>
          <input id="link" name="link" type="url" placeholder="https://...">
        </div>
      </div>
    </div>

    <div>
      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number" min="1" step="any" value="1" required>
    </div>
    <div>
      <label for="price">Unit price <span class="hint">(leave empty if you don't know)</span></label>
      <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00">
    </div>
    <div>
      <label for="grant">Grant to charge</label>
      <select id="grant" name="grant"><option value="">Loading...</option></select>
    </div>
    <div>
      <label for="needed">Needed by <span class="hint">(optional)</span></label>
      <input id="needed" name="needed" type="date">
    </div>
    <div class="full hint" id="total" hidden></div>
    <div>
      <label for="name">Your name</label>
      <input id="name" name="name" required>
    </div>
    <div>
      <label for="email">Your email <span class="hint">(you get an email when it's ordered)</span></label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="full">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" placeholder="Which project it is for, size, how soon you need it..."></textarea>
    </div>
    <div class="full buttons">
      <button type="button" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" class="primary" id="submit">Submit</button>
    </div>
    <div class="full" id="error"></div>
  </form>

  <script>
    const $ = id => document.getElementById(id);
    // Remember the name between requests, on this computer only
    try { $('name').value = localStorage.getItem('orderName') || ''; } catch (e) {}

    google.script.run
      .withSuccessHandler(info => {
        const sel = $('grant');
        sel.innerHTML = '';
        sel.add(new Option('Choose a grant', ''));
        info.grants.forEach(g => sel.add(new Option(g, g)));
        sel.add(new Option('Not sure', 'Not sure'));
        info.vendors.forEach(v => { const o = document.createElement('option'); o.value = v; $('vendors').appendChild(o); });
        if (!$('email').value) $('email').value = info.email;
        try { if (!$('email').value) $('email').value = localStorage.getItem('orderEmail') || ''; } catch (e) {}
        if (!info.strainSheet) $('strainStatus').textContent =
          'The strain collection is not connected yet (strainSheetUrl in Code.gs), so only the CGC is checked.';
      })
      .withFailureHandler(err => { $('error').textContent = err.message || err; })
      .getFormInfo();

    function onTypeChange() {
      const strain = $('type').value === 'Strain';
      $('strainPanel').hidden = !strain;
      $('suppliesPanel').hidden = strain;
      $('strain').required = strain;
      $('item').required = !strain;
    }
    $('type').addEventListener('change', onTypeChange);
    onTypeChange();

    function checkStrain() {
      const name = $('strain').value.trim();
      const status = $('strainStatus');
      if (!name) { status.textContent = 'Type a strain name first.'; return; }
      $('check').disabled = true;
      status.textContent = 'Checking our collection and the CGC...';
      google.script.run
        .withSuccessHandler(res => {
          $('check').disabled = false;
          const lines = [];
          if (res.collection) {
            lines.push(res.collection.box
              ? 'Already in our collection (' + res.collection.box + '). You may not need to order it: request it from the strain sheet instead.'
              : 'Listed in our collection but has no box, so it is not in the freezer.');
            if (res.collection.geno) $('geno').value = res.collection.geno;
          } else if (!res.note) {
            lines.push('Not in our collection.');
          }
          if (res.cgc) {
            lines.push('Found on the CGC.');
            $('strain').value = res.cgc.name;
            if (!$('geno').value) $('geno').value = res.cgc.genotype;
            $('source').value = 'CGC';
          } else {
            lines.push('Not found on the CGC. Choose NBRP or Other lab.');
          }
          if (res.note) lines.push(res.note);
          status.textContent = lines.join(' ');
        })
        .withFailureHandler(err => { $('check').disabled = false; status.textContent = err.message || err; })
        .checkStrain(name);
    }

    function updateTotal() {
      const q = Number($('quantity').value) || 0, p = $('price').value;
      $('total').hidden = p === '';
      $('total').textContent = 'Total: $' + (q * Number(p)).toFixed(2);
    }
    $('quantity').addEventListener('input', updateTotal);
    $('price').addEventListener('input', updateTotal);

    function submitForm(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData($('form')).entries());
      try { localStorage.setItem('orderName', data.name); localStorage.setItem('orderEmail', data.email); } catch (err) {}
      const btn = $('submit');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      $('error').textContent = '';
      google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = 'Submit';
          $('error').textContent = err.message || err;
        })
        .submitOrder(data);
    }
  </script>
</body>
</html>
