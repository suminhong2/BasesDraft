<style>
  body { font-family: Arial, sans-serif; font-size: 13px; margin: 0; padding: 4px 8px; color: #222; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-weight: bold; margin-bottom: 3px; }
  .hint { font-weight: normal; color: #666; font-size: 11px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px;
    border: 1px solid #bbb; border-radius: 4px; font-family: inherit; }
  textarea { resize: vertical; min-height: 48px; }
  input[readonly] { background: #f1f6ff; border-color: #c6d8f5; font-weight: bold; }
  #preview { margin-top: 4px; }
  .panel { background: #f6f8fb; border: 1px solid #dde3ec; border-radius: 4px; padding: 10px; }
  [hidden] { display: none !important; }
  .inline { display: flex; gap: 6px; }
  .inline button { white-space: nowrap; }
  .buttons { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
  button { padding: 7px 16px; font-size: 13px; border-radius: 4px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  #error { color: #b00020; margin-top: 8px; white-space: pre-wrap; }
</style>
